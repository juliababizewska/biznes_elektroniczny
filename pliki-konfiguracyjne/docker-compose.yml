version: '3'
services:
  mysql:
    container_name: some-mysql
    image: mysql:5.7
    #volumes:
      #- ../kody-zrodlowe-sklepu/mysql-data:/var/lib/mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: prestashop
    networks:
      - prestashop_network
  phpmyadmin:
    container_name: phpmyadmin
    image: phpmyadmin/phpmyadmin
    restart: unless-stopped
    depends_on:
      - mysql
    ports:
      - 8081:80
    environment:
      PMA_HOST: some-mysql
      MYSQL_ROOT_PASSWORD: admin
    networks:
      - prestashop_network
networks:
  prestashop_network:
    driver: bridge
